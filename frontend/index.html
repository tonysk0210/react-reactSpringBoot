<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <!-- 這裡的 class 是使用 Tailwind CSS 的暗模式功能來設定背景顏色。 -->
    <div id="root" class="bg-normalbg dark:bg-darkbg"></div>
    <!-- 瀏覽器載入 index.html 後，會去執行：/src/main.jsx 也就是 React 的入口檔案。 -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
