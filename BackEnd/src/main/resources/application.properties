spring.application.name=BackEnd
# console 的日志输出格式 顏色
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

# 允許使用 H2 Console; default: http://localhost:8080/h2-console
spring.h2.console.enabled=true
# H2 Database 的連接 URL; 這裡使用 file 模式，數據將保存在當前目錄下的 h2db/myDb 文件中; AUTO_SERVER=true 允許多個應用程序同時訪問該數據庫
spring.datasource.url=jdbc:h2:file:./h2db/myDb;AUTO_SERVER=true
# H2 Database 的驅動類名稱; 這裡使用 org.h2.Driver 作為 H2 Database 的 JDBC 驅動 (Optional)
spring.datasource.username=sa
spring.datasource.password=

# schema.sql 和 data.sql 的位置; 這裡使用 classpath:sql/schema.sql 和 classpath:sql/data.sql 作為 SQL 初始化腳本的位置 optional: 表示如果文件不存在則不會報錯
spring.sql.init.schema-locations=optional:classpath:sql/schema.sql
spring.sql.init.data-locations=optional:classpath:sql/data.sql
# 指定 SQL 初始化模式為 embedded，表示只有在使用嵌入式數據庫（如 H2）時才會執行 SQL 初始化腳本
# schema.sql / data.sql 的初始化，預設不一定會對 file DB 執行，所以需要明確指定 always 模式
spring.sql.init.mode=always

# 「自動配置的詳細報告」+ 額外 debug log
#debug=true